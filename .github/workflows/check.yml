name: Check

on:
  push:
    # `*` stops at a `/`
    branches-ignore: ['**-wip']
  pull_request:

permissions:
  contents: read

# a newer run for a branch or pull request cancels the older one; each
# push to master runs at once, in a group of its own
concurrency:
  group: >-
    check-${{ github.event.pull_request.number ||
    (github.ref == 'refs/heads/master' && github.run_id) ||
    github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # a pull request from a fork is checked whatever its branch is called
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !endsWith(github.head_ref, '-wip')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tools

      - name: Build
        run: make build

      # before Check, so a failing check still leaves the draft
      - name: Upload draft
        uses: actions/upload-artifact@v7
        with:
          name: draft
          path: |
            draft-*.txt
            draft-*.html
            draft-*.xml
          if-no-files-found: error
          retention-days: 14

      # -k runs every check past a failing one
      - name: Check
        run: make -k check
