name: Publish

on:
  push:
    branches: [master]

permissions:
  contents: read

# one run at a time; a newer push waits for the current one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tools

      - name: Build
        run: make build

      # -k runs every check past a failing one
      - name: Check
        run: make -k check

      - name: Assemble site
        run: |
          mkdir _site
          cp draft-*.html draft-*.txt draft-*.xml _site/
          cp draft-*.html _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
