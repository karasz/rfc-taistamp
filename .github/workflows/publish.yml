name: Publish

on:
  push:
    branches: [master]

permissions:
  contents: read

# one run at a time; a newer push waits for the current one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tools

      - name: Build
        run: make build

      # -k runs every check past a failing one
      - name: Check
        run: make -k check || echo "::warning::make check failed"

      - name: Assemble site
        run: |
          mkdir _site
          cp draft-*.html draft-*.txt draft-*.xml _site/
          cp draft-*.html _site/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
